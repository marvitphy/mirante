[package]
name = "mirante-process-audio"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi6", "async"] }
napi-derive = "2.16"
crossbeam-channel = "0.5"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
  # `implement` generates the *_Impl traits used for the COM completion
  # handler. Without it IActivateAudioInterfaceCompletionHandler_Impl simply
  # does not exist.
  "implement",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_KernelStreaming",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
]

# The #[implement] macro expands to paths rooted at `windows_core`, so the
# crate has to be nameable here even though we never call it directly.
[target.'cfg(windows)'.dependencies.windows-core]
version = "0.58"

[build-dependencies]
napi-build = "2.1"

[profile.release]
lto = true
strip = "symbols"
