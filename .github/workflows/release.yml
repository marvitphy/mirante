name: release

# Push a tag, get an installer your friends can download — and that every
# already-installed copy will pick up automatically.
#
#   npm version patch        # bumps package.json and creates the tag
#   git push --follow-tags
on:
  push:
    tags:
      - 'v*'
  # Handy for testing the pipeline without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require a reachable signalling URL
        if: ${{ vars.MIRANTE_SIGNAL_URL == '' }}
        run: |
          echo "::error::MIRANTE_SIGNAL_URL is not set. A release built without it points at ws://localhost:8787, which exists on nobody else's machine — the installer would be dead on arrival. Set it under Settings -> Secrets and variables -> Actions -> Variables."
          exit 1

      # Electron and electron-builder each download a large toolchain on first
      # use, and on a fresh Windows runner that is most of `npm ci`. They are
      # keyed by the versions in the lockfile, so the cache only misses when
      # one of them actually changes.
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Generate icon
        run: npm run icon

      # The addon is a Rust build that takes about a minute, and almost no
      # release touches Rust. Keyed on the sources themselves, so it rebuilds
      # exactly when it must and is restored in seconds otherwise.
      - name: Cache the audio addon
        id: addon-cache
        uses: actions/cache@v4
        with:
          path: native/process-audio/*.node
          key: >-
            addon-${{ runner.os }}-${{ hashFiles(
              'native/process-audio/src/**',
              'native/process-audio/Cargo.toml',
              'native/process-audio/Cargo.lock',
              'native/process-audio/package.json'
            ) }}

      - name: Rust toolchain
        if: steps.addon-cache.outputs.cache-hit != 'true'
        run: rustup default stable

      - uses: Swatinem/rust-cache@v2
        if: steps.addon-cache.outputs.cache-hit != 'true'
        with:
          workspaces: native/process-audio

      # Per-application audio capture — the component that keeps your friends'
      # voices out of your broadcast. Required: a release without it silently
      # loses the feature, and nobody would notice until the echo showed up.
      - name: Build per-application audio addon
        if: steps.addon-cache.outputs.cache-hit != 'true'
        working-directory: native/process-audio
        run: |
          npm install --prefer-offline --no-audit --fund=false
          npm run build

      - name: Verify the addon is there
        # Runs on a cache hit too: this is exactly where a cache that restored
        # nothing has to be caught, not three minutes later in the installer.
        working-directory: native/process-audio
        run: |
          if (-not (Test-Path *.node)) { throw "no .node produced" }
          Get-ChildItem -Path *.node, index.js | Format-Table Name, Length

      - name: Build and publish
        env:
          # Provided by Actions; electron-builder uses it to create the release
          # and upload the installer plus the latest.yml that clients poll.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The signalling server every installed copy will talk to. Set this
          # as a repository variable, or the build ships pointing at localhost
          # and nobody can connect to anybody.
          MIRANTE_SIGNAL_URL: ${{ vars.MIRANTE_SIGNAL_URL }}
        run: npm run release

      # electron-builder reported success on v0.1.40 having uploaded only
      # the blockmap: no installer, and no latest.yml, so every installed
      # copy polled a 404 and nobody could update. A publisher that
      # half-finishes and exits zero is worse than one that fails, because
      # nothing tells you. So the release is not done until the files are
      # actually there.
      #
      # Only two of them are load-bearing. `latest.yml` is what installed
      # copies poll and the installer is what they then fetch; without
      # either, updating is broken for everyone. The blockmap serves
      # differential downloads, which this app disables outright
      # (updater.ts), so a missing one is worth a warning and not worth
      # failing a release that otherwise works.
      - name: Make sure the release really has its files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $required = @("Mirante-$version-x64.exe", "latest.yml")
          $optional = @("Mirante-$version-x64.exe.blockmap")

          function Get-Assets { ,@(gh release view $tag --json assets -q '.assets[].name') }

          $have = Get-Assets
          $missing = @($required + $optional | Where-Object { $_ -notin $have })
          foreach ($name in $missing) {
            $path = Join-Path dist $name
            if (-not (Test-Path $path)) {
              Write-Host "::warning::$name nao foi gerado em dist, nada a subir"
              continue
            }
            Write-Host "faltando no release: $name — subindo"
            # No @ sigil: splatting a single string enumerates its CHARACTERS,
            # and gh received "d" as a path. Native commands take arrays as-is.
            gh release upload $tag $path --clobber
          }

          $have = Get-Assets
          $stillRequired = @($required | Where-Object { $_ -notin $have })
          $stillOptional = @($optional | Where-Object { $_ -notin $have })
          foreach ($name in $stillOptional) {
            Write-Host "::warning::$name ausente; download diferencial esta desligado, segue"
          }
          if ($stillRequired.Count -gt 0) {
            throw "release $tag nao da para instalar, falta: $($stillRequired -join ', ')"
          }
          Write-Host "release $tag completa o bastante para atualizar"
